<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StreetPunch</title>
  <style>
    body { margin: 0; background: #14161a; color: #e8e8ea; font: 16px system-ui, sans-serif; }
    main { max-width: 680px; margin: 0 auto; padding: 16px; }
    h1 { margin: 0 0 12px; font-size: 1.4rem; }
    form { display: flex; gap: 8px; margin-bottom: 8px; }
    input { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #444; background: #1e2127; color: inherit; }
    button { padding: 8px 16px; border-radius: 6px; border: 0; background: #e4572e; color: #fff; cursor: pointer; }
    button:disabled { background: #555; cursor: default; }
    /* El tamaño interno (640x640) lo fija el HTML; el CSS solo lo adapta a pantallas estrechas. */
    canvas { display: block; width: 100%; height: auto; background: #0d0e11; border-radius: 8px; }
    p { margin: 8px 0; min-height: 1.2em; }
    #hud { font-size: 1.2rem; font-weight: 600; }
    #scores { list-style: none; margin: 8px 0; padding: 0; display: grid; gap: 4px; }
    #scores .row { display: grid; grid-template-columns: 16px 1fr auto 6.5rem; gap: 10px; align-items: center;
                   padding: 6px 10px; border-radius: 6px; background: #1e2127; }
    #scores .row.me { outline: 1px solid #aab; }
    #scores .row.eliminated, #scores .row.spectator { opacity: 0.55; }
    #scores .swatch { width: 14px; height: 14px; border-radius: 50%; }
    #scores .wins { font-weight: 700; }
    #scores .status { color: #889; font-size: 0.85rem; text-align: right; }
    #help { color: #889; font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <h1>StreetPunch</h1>
    <form id="join">
      <!-- maxlength 16 = MAX_NAME_LEN del servidor; el servidor valida de todas formas. -->
      <input id="name" maxlength="16" placeholder="Tu nombre" autocomplete="off" required>
      <button id="enter">Entrar</button>
    </form>
    <p id="status">Escribe un nombre para entrar.</p>
    <canvas id="arena" width="640" height="640"></canvas>
    <p id="hud"></p>
    <ul id="scores" aria-label="Marcador"></ul>
    <p id="help">Moverse: flechas o WASD. Embestir: mantén Espacio (o J / K) para cargar y suelta. Tras embestir hay 1,5 s de recarga: el anillo gris la muestra.</p>
  </main>
  <script src="/client.js"></script>
</body>
</html>
